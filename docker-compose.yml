services:
  postgres:
    image: postgres:16-alpine
    container_name: stoki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stoki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stoki_password}
      POSTGRES_DB: ${POSTGRES_DB:-stoki_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stoki-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

